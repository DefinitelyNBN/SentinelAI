seed: 42
project_name: SENTINELAI
track: "Track 1 — Deep Learning for Signals"
version: "2.0"

dataset:
  name: "Paderborn University Bearing Dataset"
  subtrack: "Three-class bearing-disjoint vibration classification"
  root: "."                                          # project root; MAT paths are relative to it
  manifest: "data/metadata/paderborn_manifest.csv"  # generated by src/generate_manifest.py
  norm_stats: "data/metadata/paderborn_norm_stats.json"  # training-only stats; written by generate_manifest
  path_column: mat_path   # column used by PaderbornDataset (not a .npy path)
  label_column: label
  split_column: split
  train_split: train
  val_split: validation
  test_split: test
  representation: "1d_signal"  # vibration_1 only
  signal_length: 64000          # 1.0 s × 64 kHz
  sampling_rate: 64000          # nominal Hz
  num_classes: 3                # healthy / outer_ring / inner_ring
  classes:
    - healthy
    - outer_ring
    - inner_ring

# Phase 4 note: Track 1 organizer material does not specify a mandatory
# baseline, metric, or dataset.  These are team-defined.
official_baseline:
  name: null
  implementation: null
  preprocessing: null
  training_protocol: null

# Team-selected primary metric
primary_metric: "macro_f1"

# Preprocessing pipeline (configurable; defaults match existing approved pipeline)
preprocessing:
  filter_enabled: false         # Set true to enable bandpass filtering
  filter_type: "bandpass"       # bandpass | highpass | lowpass
  filter_low_hz: 100            # Low cutoff (ignored if highpass)
  filter_high_hz: 20000         # High cutoff (ignored if lowpass)
  filter_order: 4               # Butterworth order
  normalization_method: "zscore" # zscore | minmax | none
  # NOTE: normalization statistics are always computed from training data only.
  # See data/metadata/paderborn_norm_stats.json

model:
  # Encoder channel configs (legacy models, preserved for backward compatibility)
  temporal_channels: [32, 64]
  frequency_channels: [16, 32]
  # Compact ImprovedSentinelAI encoder widths (~25K trainable parameters).
  # Legacy widths above remain unchanged for the historical models.
  improved_temporal_channels: [12, 24]
  improved_frequency_channels: [8, 16]
  embedding_dim: 64
  dropout: 0.2

  # STFT parameters
  # n_fft=2048, hop=512 → 31.25 Hz/bin, separates BPFO/BPFI harmonics
  n_fft: 2048
  hop_length: 512

  # Attention configuration (SentinelAI_MSRF_v2)
  attention:
    enabled: true
    reduction: 4                # SE reduction ratio for ChannelAttention1D/2D

  # Fusion type: gated | concat | attention
  # 'gated' uses sigmoid gate: fused = g * z_t + (1-g) * z_f
  fusion_type: "gated"

  # Class-weighted loss (weights computed from train labels only)
  use_class_weights: false

  # Band-limited STFT experiment (Phase 6C-A ablation — do not use as default)
  band_limit_hz: 1000.0

training:
  batch_size: 32
  epochs: 30
  max_epochs: 30
  learning_rate: 0.001
  weight_decay: 0.0001
  patience: 6
  num_workers: 0
  scheduler: "cosine"           # cosine | none
  grad_clip: 1.0                # max gradient norm (0 = disabled)
  augmentation:
    gaussian_noise_std: 0.0   # disabled for baseline
    amplitude_scale: 0.0      # disabled for baseline

evaluation:
  metric: macro_f1
  # Best checkpoint resolution order (used by inference.py)
  # Each entry is tried in order; first existing file wins.
  checkpoint_priority:
    - results/checkpoints/frequency_only.pt
    - results/checkpoints/sentinelai.pt

final_evaluation:
  enabled: false  # Never enable until validation selection is complete.
  model: sentinelai
